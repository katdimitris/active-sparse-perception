# ImageNet-100 at 160 px.  Evaluation set: the 5,000 val images plus 100 held-out
# train images per class (15,000 images); those 10,000 are removed from training.
DATA:
  IMG_SIZE: 160
  BATCH_SIZE: 512            # per GPU; the runs used 2 GPUs (global batch 1024)
  HELDOUT_PER_CLASS: 100
SF:
  WIDTH_CONFIGURATIONS: [192, 384]
  BLOCK_SIZES: [1, 3]        # focus unit, then 3 cortex blocks
  REPEATS: [4, 1]            # 4 focus iterations per round
  HEAD_DIM: 4
  CORTEX_SAMPLES: False
TRAIN:
  EPOCHS: 200
  WARMUP_EPOCHS: 5
  BASE_LR: 5.0e-4            # per 512 images -> 1e-3 at batch 1024
